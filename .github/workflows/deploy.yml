name: Frontend CI/CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  S3_BUCKET: cloud-resume-site-michaelovbey-com
  DISTRIBUTION_ID: EC645XXTSMP64

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::569202654897:role/github-actions-frontend
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync ./site s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
